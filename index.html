<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a5f52" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aqd-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <title>AQuickDraft — Write freely. Label honestly.</title>
    <meta name="description" content="AQuickDraft is a quiet writing space for amateurs — timed sessions, cloud drafts, honest AI labels, and peer feedback." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AQuickDraft" />
    <meta property="og:title" content="AQuickDraft — Write freely. Label honestly." />

    <meta property="og:image" content="https://www.aquickdraft.com/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  </body>
</html>
